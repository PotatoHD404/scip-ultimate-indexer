<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/force-graph"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.82);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #818cf8;
    }
    body {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      background:
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.18), transparent 50%),
        radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.14), transparent 50%),
        var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .header {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 10;
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .description {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .stats {
      color: var(--accent);
      font-weight: 600;
    }
    .note {
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 6px;
      max-width: 520px;
      line-height: 1.3;
    }
    #network {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">{{ title }}</div>
      <div class="description">{{ description }}</div>
      {% if performance_notice %}
      <div class="note">{{ performance_notice }}</div>
      {% endif %}
    </div>
    <div class="stats">Nodes: {{ node_count }} | Edges: {{ edge_count }}</div>
  </div>
  <div id="network"></div>
  <script>
    const performanceMode = {{ "true" if performance_mode else "false" }};
    const edgeChunkSize = {{ edge_chunk_size }};
    const rawNodes = {{ nodes_json | safe }};
    const rawEdges = {{ edges_json | safe }};
    const container = document.getElementById("network");
    let hoveredNode = null;

    function drawNodeLabel(node, ctx, globalScale) {
      if (!node.label) {
        return;
      }
      const fontSize = Math.max(10, 14 / globalScale);
      const text = node.label;
      ctx.font = `${fontSize}px JetBrains Mono`;
      const textWidth = ctx.measureText(text).width;
      const bckgDimensions = [textWidth + 10, fontSize + 8];

      ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
      ctx.fillRect(
        node.x + 8,
        node.y - bckgDimensions[1] / 2,
        bckgDimensions[0],
        bckgDimensions[1],
      );

      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#f8fafc";
      ctx.fillText(text, node.x + 13, node.y);
    }

    function addInChunks(dataset, items, chunkSize, onDone) {
      if (!items.length) {
        if (onDone) onDone();
        return;
      }
      let index = 0;
      const safeChunkSize = Math.max(200, chunkSize);
      const pump = () => {
        const end = Math.min(index + safeChunkSize, items.length);
        dataset.add(items.slice(index, end));
        index = end;
        if (index < items.length) {
          setTimeout(pump, 0);
          return;
        }
        if (onDone) onDone();
      };
      pump();
    }

    function renderVisNetwork() {
      const nodes = new vis.DataSet();
      const edges = new vis.DataSet();
      const network = new vis.Network(container, { nodes, edges }, {
        nodes: {
          shape: "dot",
          size: 18,
          borderWidth: 2,
          font: { color: "#f8fafc", size: 12, face: "JetBrains Mono", strokeWidth: 0 }
        },
        edges: {
          arrows: "to",
          smooth: false,
          color: { color: "#64748b", highlight: "#818cf8" },
          font: { color: "#cbd5e1", size: 10 }
        },
        physics: {
          solver: "barnesHut",
          barnesHut: {
            gravitationalConstant: -4200,
            centralGravity: 0.06,
            springLength: 120,
            springConstant: 0.04,
            damping: 0.15
          },
          stabilization: { iterations: 90, fit: true }
        },
        interaction: {
          hover: true
        },
        layout: {
          improvedLayout: true,
          randomSeed: 11
        }
      });

      network.once("stabilizationIterationsDone", () => {
        network.setOptions({ physics: false });
      });

      addInChunks(nodes, rawNodes, rawNodes.length, () => {
        addInChunks(edges, rawEdges, rawEdges.length);
      });
    }

    function renderForceGraph() {
      window.devicePixelRatio = 1;
      const graphData = {
        nodes: rawNodes.map(node => ({
          id: node.id,
          label: node.label,
          title: node.title,
          color: node.color.background,
          borderColor: node.color.border,
          val: 1
        })),
        links: rawEdges.map(edge => ({
          source: edge.from,
          target: edge.to,
          label: edge.label || ""
        }))
      };

      const graph = new ForceGraph(container)
        .graphData(graphData)
        .backgroundColor("rgba(0,0,0,0)")
        .nodeId("id")
        .nodeLabel(node => {
          if (!node.title && !node.label) {
            return "";
          }
          const safeTitle = (node.title || "").replace(/\n/g, "<br>");
          const safeLabel = node.label ? `<strong>${node.label}</strong><br>` : "";
          return `<div style="padding:6px 8px;background:#0f172a;border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:#f8fafc;font-family:JetBrains Mono, monospace;font-size:12px;">${safeLabel}${safeTitle}</div>`;
        })
        .nodeRelSize(4)
        .nodeVal(node => node.val)
        .nodeColor(node => node.color)
        .linkColor(() => "rgba(100, 116, 139, 0.18)")
        .linkWidth(0.35)
        .cooldownTime(45000)
        .d3AlphaDecay(0)
        .d3VelocityDecay(0.08)
        .enableNodeDrag(true)
        .enablePanInteraction(true)
        .enableZoomInteraction(true)
        .zoom(0.18)
        .onNodeHover(node => {
          hoveredNode = node || null;
          container.style.cursor = node ? "pointer" : "grab";
        })
        .onNodeDragEnd(node => {
          node.fx = node.x;
          node.fy = node.y;
        })
        .onRenderFramePost((ctx, globalScale) => {
          if (!hoveredNode) {
            return;
          }
          drawNodeLabel(hoveredNode, ctx, globalScale);
        });

      const charge = graph.d3Force("charge");
      if (charge && typeof charge.strength === "function") {
        charge.strength(-18);
      }
      const linkForce = graph.d3Force("link");
      if (linkForce && typeof linkForce.distance === "function") {
        linkForce.distance(18);
      }
      if (linkForce && typeof linkForce.strength === "function") {
        linkForce.strength(0.08);
      }
      graph.d3ReheatSimulation();
    }

    if (performanceMode) {
      renderForceGraph();
    } else {
      renderVisNetwork();
    }
  </script>
</body>
</html>
