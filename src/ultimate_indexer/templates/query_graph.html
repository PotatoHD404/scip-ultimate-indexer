<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.82);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #818cf8;
    }
    body {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      background:
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.18), transparent 50%),
        radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.14), transparent 50%),
        var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .header {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 10;
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .description {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .stats {
      color: var(--accent);
      font-weight: 600;
    }
    .note {
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 6px;
      max-width: 520px;
      line-height: 1.3;
    }
    #network {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">{{ title }}</div>
      <div class="description">{{ description }}</div>
      {% if performance_notice %}
      <div class="note">{{ performance_notice }}</div>
      {% endif %}
    </div>
    <div class="stats">Nodes: {{ node_count }} | Edges: {{ edge_count }}</div>
  </div>
  <div id="network"></div>
  <script>
    const performanceMode = {{ "true" if performance_mode else "false" }};
    const edgeChunkSize = {{ edge_chunk_size }};
    const rawNodes = {{ nodes_json | safe }};
    const rawEdges = {{ edges_json | safe }};
    const nodes = new vis.DataSet();
    const edges = new vis.DataSet();
    const container = document.getElementById("network");
    const network = new vis.Network(container, { nodes, edges }, {
      nodes: {
        shape: "dot",
        size: performanceMode ? 10 : 18,
        borderWidth: performanceMode ? 1 : 2,
        font: { color: "#f8fafc", size: performanceMode ? 10 : 12, face: "JetBrains Mono", strokeWidth: 0 }
      },
      edges: performanceMode
        ? {
            arrows: { to: { enabled: false } },
            smooth: false,
            width: 0.7,
            color: { color: "#5b6b82", highlight: "#94a3b8" },
          }
        : {
            arrows: "to",
            smooth: false,
            color: { color: "#64748b", highlight: "#818cf8" },
            font: { color: "#cbd5e1", size: 10 }
          },
      physics: performanceMode
        ? false
        : {
            solver: "barnesHut",
            barnesHut: {
              gravitationalConstant: -4200,
              centralGravity: 0.06,
              springLength: 120,
              springConstant: 0.04,
              damping: 0.15
            },
            stabilization: { iterations: 90, fit: true }
          },
      interaction: performanceMode
        ? {
            hover: false,
            hideEdgesOnDrag: true,
            hideEdgesOnZoom: true,
            tooltipDelay: 250
          }
        : {
            hover: true
          },
      layout: {
        improvedLayout: !performanceMode,
        randomSeed: 11
      }
    });

    function addInChunks(dataset, items, chunkSize, onDone) {
      if (!items.length) {
        if (onDone) onDone();
        return;
      }
      let index = 0;
      const safeChunkSize = Math.max(200, chunkSize);
      const pump = () => {
        const end = Math.min(index + safeChunkSize, items.length);
        dataset.add(items.slice(index, end));
        index = end;
        if (index < items.length) {
          setTimeout(pump, 0);
          return;
        }
        if (onDone) onDone();
      };
      pump();
    }

    if (!performanceMode) {
      network.once("stabilizationIterationsDone", () => {
        network.setOptions({ physics: false });
      });
    }

    const nodeChunkSize = performanceMode ? 1500 : rawNodes.length;
    const edgeChunkSizeRuntime = performanceMode ? edgeChunkSize : rawEdges.length;
    addInChunks(nodes, rawNodes, nodeChunkSize, () => {
      addInChunks(edges, rawEdges, edgeChunkSizeRuntime, () => {
        if (performanceMode) {
          network.fit({ animation: false });
        }
      });
    });
  </script>
</body>
</html>
