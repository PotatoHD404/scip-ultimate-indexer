<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/force-graph"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.82);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #818cf8;
    }
    body {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      background:
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.18), transparent 50%),
        radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.14), transparent 50%),
        var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .header {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 10;
      border: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .description {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .stats {
      color: var(--accent);
      font-weight: 600;
    }
    .note {
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 6px;
      max-width: 520px;
      line-height: 1.3;
    }
    #network {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">{{ title }}</div>
      <div class="description">{{ description }}</div>
      {% if performance_notice %}
      <div class="note">{{ performance_notice }}</div>
      {% endif %}
    </div>
    <div class="stats">Nodes: {{ node_count }} | Edges: {{ edge_count }}</div>
  </div>
  <div id="network"></div>
  <script>
    const performanceMode = {{ "true" if performance_mode else "false" }};
    const rawNodes = {{ nodes_json | safe }};
    const rawEdges = {{ edges_json | safe }};
    const container = document.getElementById("network");
    let hoveredNode = null;

    function escapeHtml(value) {
      return (value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function labelLines(text) {
      return (text || "").split("\n").filter(Boolean);
    }

    function drawNodeLabel(node, ctx, globalScale) {
      const lines = labelLines(node.label);
      if (!lines.length) {
        return;
      }
      const fontSize = Math.max(10, 13 / globalScale);
      const lineHeight = fontSize + 4;
      ctx.font = `${fontSize}px JetBrains Mono`;
      const textWidth = Math.max(...lines.map(line => ctx.measureText(line).width));
      const boxWidth = textWidth + 14;
      const boxHeight = lines.length * lineHeight + 10;
      const radius = Math.max(3, node.scale || 3);
      const x = node.x + radius + 8;
      const y = node.y - boxHeight / 2;

      ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
      ctx.fillRect(x, y, boxWidth, boxHeight);

      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillStyle = "#f8fafc";
      lines.forEach((line, index) => {
        ctx.fillText(line, x + 7, y + 5 + index * lineHeight);
      });
    }

    function shouldShowPersistentLabel(node, globalScale) {
      if (!node.alwaysLabel) {
        return false;
      }
      if (rawNodes.length <= 120) {
        return globalScale >= 0.45;
      }
      return globalScale >= 0.9;
    }

    function paintNode(node, ctx, globalScale) {
      const radius = Math.max(2.6, node.scale || 3.2);
      ctx.beginPath();
      ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI, false);
      ctx.fillStyle = node.color;
      ctx.fill();
      ctx.lineWidth = Math.max(0.8, 1.8 / globalScale);
      ctx.strokeStyle = node.borderColor;
      ctx.stroke();

      if (hoveredNode && hoveredNode.id === node.id) {
        drawNodeLabel(node, ctx, globalScale);
        return;
      }
      if (shouldShowPersistentLabel(node, globalScale)) {
        drawNodeLabel(node, ctx, globalScale);
      }
    }

    function paintPointerArea(node, color, ctx) {
      const radius = Math.max(5, (node.scale || 3.2) + 4);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI, false);
      ctx.fill();
    }

    window.devicePixelRatio = 1;
    const graphData = {
      nodes: rawNodes.map(node => ({
        id: node.id,
        label: node.label,
        fullLabel: node.fullLabel || node.label,
        title: node.title,
        color: node.color.background,
        borderColor: node.color.border,
        scale: node.scale || 1,
        alwaysLabel: Boolean(node.alwaysLabel)
      })),
      links: rawEdges.map(edge => ({
        source: edge.from,
        target: edge.to,
        label: edge.label || ""
      }))
    };

    const graph = new ForceGraph(container)
      .graphData(graphData)
      .backgroundColor("rgba(0,0,0,0)")
      .nodeId("id")
      .nodeLabel(node => {
        const titleLines = escapeHtml(node.title || "").replace(/\n/g, "<br>");
        const fullName = escapeHtml(node.fullLabel || "");
        return `<div style="padding:6px 8px;background:#0f172a;border:1px solid rgba(255,255,255,0.12);border-radius:8px;color:#f8fafc;font-family:JetBrains Mono, monospace;font-size:12px;"><strong>${fullName}</strong><br>${titleLines}</div>`;
      })
      .nodeCanvasObject(paintNode)
      .nodeCanvasObjectMode(() => "replace")
      .nodePointerAreaPaint(paintPointerArea)
      .linkColor(() => performanceMode ? "rgba(100, 116, 139, 0.16)" : "rgba(100, 116, 139, 0.28)")
      .linkWidth(() => performanceMode ? 0.3 : 0.55)
      .linkDirectionalArrowLength(performanceMode ? 0 : 3.5)
      .linkDirectionalArrowRelPos(1)
      .cooldownTime(performanceMode ? 60000 : 18000)
      .d3AlphaDecay(performanceMode ? 0 : 0.028)
      .d3VelocityDecay(performanceMode ? 0.08 : 0.18)
      .enableNodeDrag(true)
      .enablePanInteraction(true)
      .enableZoomInteraction(true)
      .enablePointerInteraction(true)
      .minZoom(0.02)
      .zoom(performanceMode ? 0.18 : 0.85)
      .onNodeHover(node => {
        hoveredNode = node || null;
        container.style.cursor = node ? "pointer" : "grab";
      })
      .onNodeDragEnd(node => {
        node.fx = node.x;
        node.fy = node.y;
      });

    const charge = graph.d3Force("charge");
    if (charge && typeof charge.strength === "function") {
      charge.strength(node => -(18 + (node.scale || 1) * (performanceMode ? 2.5 : 5)));
    }
    const linkForce = graph.d3Force("link");
    if (linkForce && typeof linkForce.distance === "function") {
      linkForce.distance(link => {
        const sourceScale = typeof link.source === "object" ? (link.source.scale || 1) : 1;
        const targetScale = typeof link.target === "object" ? (link.target.scale || 1) : 1;
        const meanScale = (sourceScale + targetScale) / 2;
        return (performanceMode ? 14 : 30) + meanScale * (performanceMode ? 3 : 5);
      });
    }
    if (linkForce && typeof linkForce.strength === "function") {
      linkForce.strength(performanceMode ? 0.08 : 0.14);
    }

    setTimeout(() => {
      if (typeof graph.zoomToFit === "function") {
        graph.zoomToFit(250, 80);
      }
      graph.d3ReheatSimulation();
    }, 50);
  </script>
</body>
</html>
