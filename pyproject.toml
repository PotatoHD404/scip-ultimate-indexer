[tool.poetry]
name = "scip-ultimate-indexer"
version = "0.1.0"
description = "A self-contained SCIP-first code indexer with semantic search, weighted inverse personalized PageRank, visuals, and MCP."
authors = ["Codex <codex@example.com>"]
readme = "README.md"
packages = [{ include = "ultimate_indexer", from = "src" }]
include = [
    { path = "src/ultimate_indexer/templates/*.html", format = ["sdist", "wheel"] }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
typer = "^0.16.1"
rich = "^14.1.0"
networkx = "^3.6"
numpy = "^2.4.3"
protobuf = "^6.33.0"
pathspec = "^0.12.1"
mcp = "^1.26.0"
huggingface-hub = "^1.7.1"
llama-cpp-python = "^0.3.16"
jinja2 = "^3.1.6"
torch = "^2.10.0"
sentence-transformers = "^5.3.0"
einops = "^0.8.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"

[tool.poetry.scripts]
ultimate-indexer = "ultimate_indexer.cli:app"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
